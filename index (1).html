<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KAIRA GARMENT | Jersey Collection</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style id="app-css">
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#050505;color:#fff;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;color:inherit}

/* HEADER */
header{width:100%;position:fixed;top:0;left:0;z-index:1000;background:rgba(0,0,0,.82);backdrop-filter:blur(15px);border-bottom:1px solid rgba(212,175,55,.25);padding-top:env(safe-area-inset-top,0px)}
.navbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 6%}
.logo img{width:110px;height:107px;object-fit:contain;display:block;transition:.5s}
.logo img:hover{transform:scale(1.05);filter:drop-shadow(0 0 12px rgba(212,175,55,.7))}

/* MAIN */
.products-section{min-height:100vh;padding:190px 5% 90px;background:radial-gradient(ellipse at top,#15120a 0%,#050505 60%)}
.section-title{text-align:center;margin-bottom:55px;animation:titleAnimation 1.2s ease}
.section-title h1{font-size:50px;font-weight:700;letter-spacing:1px}
.section-title h1 span{color:#d4af37;text-shadow:0 0 20px rgba(212,175,55,.25)}
.section-title p{margin-top:15px;color:#aaa;font-size:17px;letter-spacing:.5px}

.product-container{width:100%;max-width:1600px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.product-card{position:relative;height:250px;overflow:hidden;border-radius:18px;background:#111;border:1px solid rgba(212,175,55,.25);cursor:pointer;opacity:0;transform:translateY(60px) scale(.94);animation:cardAnimation .9s ease forwards;transition:transform .5s ease,border-color .5s ease,box-shadow .5s ease}
.product-card:hover{transform:translateY(-10px) scale(1.03);border-color:#d4af37;box-shadow:0 0 20px rgba(212,175,55,.2),0 20px 50px rgba(0,0,0,.8)}
.product-image{width:100%;height:100%;overflow:hidden;position:relative;background:#111}
.product-image img{width:100%;height:100%;display:block;object-fit:cover;transition:transform 1s cubic-bezier(.2,.8,.2,1),filter .6s ease}
.product-card:hover .product-image img{transform:scale(1.12);filter:brightness(1.08) contrast(1.05)}
.product-image::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 25%,rgba(212,175,55,.22),transparent 70%);transform:translateX(-120%);transition:1s ease;pointer-events:none}
.product-card:hover .product-image::after{transform:translateX(120%)}
.product-image::before{content:"VIEW";position:absolute;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);padding:11px 25px;border:1px solid #d4af37;border-radius:30px;color:#d4af37;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);font-size:13px;font-weight:bold;letter-spacing:3px;opacity:0;transition:.5s;pointer-events:none}
.product-card:hover .product-image::before{opacity:1;transform:translate(-50%,-50%) scale(1)}

.empty-state{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed rgba(212,175,55,.35);border-radius:18px;color:#aaa;line-height:1.8}
.empty-state b{color:#d4af37;display:block;font-size:20px;margin-bottom:6px}

/* ADMIN */
.del-btn{position:absolute;z-index:8;top:10px;right:10px;padding:6px 12px;border-radius:20px;background:rgba(160,20,20,.92);color:#fff;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.25)}
.del-btn.sure{background:#e11d1d;box-shadow:0 0 0 3px rgba(225,29,29,.35)}
.admin-bar{position:fixed;z-index:1500;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(760px,94%);display:none;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:rgba(10,10,10,.96);border:1px solid #d4af37;box-shadow:0 10px 40px rgba(0,0,0,.8)}
.admin-bar.show{display:flex}
.admin-info{flex:1 1 220px;font-size:13px;color:#ccc;line-height:1.5}
.admin-info b{color:#d4af37}
.admin-info .warn{color:#ffb454}
.btn{padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;letter-spacing:.5px;border:1px solid #d4af37;color:#d4af37;background:transparent;transition:.3s}
.btn:hover{background:#d4af37;color:#000}
.btn.primary{background:#d4af37;color:#000}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:transparent;color:#d4af37}
.btn.primary:disabled{background:#d4af37;color:#000}
.toast{position:fixed;z-index:9500;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:92%;padding:12px 20px;border-radius:12px;background:#111;border:1px solid #d4af37;color:#fff;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.8);display:none;text-align:center}
.toast.show{display:block}
.toast.err{border-color:#e11d1d}

/* LOGIN */
.login-screen{position:fixed;inset:0;z-index:6000;display:none;justify-content:center;align-items:center;padding:20px;background:radial-gradient(ellipse at center,#1a1508 0%,#000 70%);overflow:auto}
.login-screen.show{display:flex}
.login-box{width:100%;max-width:400px;padding:34px 30px;border-radius:20px;background:rgba(12,12,12,.95);border:1px solid rgba(212,175,55,.5);box-shadow:0 0 60px rgba(212,175,55,.12);text-align:center}
.login-box img{width:120px;height:117px;object-fit:contain}
.login-box h2{margin:8px 0 4px;font-size:24px;color:#d4af37}
.login-box p.sub{color:#888;font-size:13px;margin-bottom:22px}
.field{position:relative;margin-bottom:14px;text-align:left}
.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px;letter-spacing:.5px}
.field input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(212,175,55,.35);background:#0a0a0a;color:#fff;font-size:15px;outline:none;transition:.3s}
.field input:focus{border-color:#d4af37;box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.eye{position:absolute;right:8px;bottom:6px;padding:7px 10px;font-size:12px;color:#d4af37}
.login-err{min-height:20px;margin:4px 0 12px;color:#ff6b6b;font-size:13px}
.login-box .btn{width:100%;padding:13px}
.login-box .back{margin-top:12px;font-size:13px;color:#888;background:none;border:none;letter-spacing:0}
.login-box .back:hover{color:#d4af37;background:none}


.upload-box{display:none;max-width:1600px;margin:0 auto 30px;padding:34px 20px;text-align:center;border:2px dashed #d4af37;border-radius:20px;background:rgba(212,175,55,.06);cursor:pointer;transition:.3s}
.upload-box.show{display:block}
.upload-box:hover,.upload-box.drag{background:rgba(212,175,55,.16);box-shadow:0 0 30px rgba(212,175,55,.2)}
.upload-box .plus{font-size:44px;line-height:1;color:#d4af37}
.upload-box b{display:block;margin-top:8px;font-size:20px;color:#d4af37}
.upload-box span{display:block;margin-top:6px;color:#aaa;font-size:14px}
.admin-text{margin-left:14px;font-size:13px;color:#d4af37;border:1px solid rgba(212,175,55,.5);padding:6px 14px;border-radius:20px;transition:.3s}
.admin-text:hover{background:#d4af37;color:#000}

/* MODAL */
.image-modal{position:fixed;inset:0;z-index:5000;display:flex;justify-content:center;align-items:center;padding:30px;background:rgba(0,0,0,.96);opacity:0;visibility:hidden;transition:.4s}
.image-modal.active{opacity:1;visibility:visible}
.image-modal img{max-width:92%;max-height:88vh;object-fit:contain;border-radius:12px;border:1px solid rgba(212,175,55,.65);box-shadow:0 0 60px rgba(212,175,55,.25);transform:scale(.65);transition:.5s}
.image-modal.active img{transform:scale(1)}
.close-modal{position:absolute;top:calc(25px + env(safe-area-inset-top,0px));right:30px;width:48px;height:48px;border-radius:50%;border:1px solid #d4af37;background:#080808;color:#d4af37;font-size:28px;line-height:45px;text-align:center;transition:.4s}
.close-modal:hover{background:#d4af37;color:#000;transform:rotate(90deg) scale(1.05)}

/* FOOTER */
footer{text-align:center;padding:28px 15px calc(28px + env(safe-area-inset-bottom,0px));background:#030303;color:#777;font-size:14px;border-top:1px solid rgba(212,175,55,.15)}
footer span.brand{color:#d4af37}
.footer-links{display:inline-flex;align-items:center;gap:18px;margin-left:20px;vertical-align:middle}
.footer-links a,.footer-links button{color:#fff;text-decoration:none;transition:.3s ease;display:inline-flex}
.footer-links svg{width:22px;height:22px;fill:currentColor}
.footer-links a:hover{color:#d4af37;transform:scale(1.2) translateY(-2px)}
.footer-links .lock{color:#444}
.footer-links .lock:hover{color:#d4af37}
.footer-links .lock svg{width:15px;height:15px}
body.has-admin footer{padding-bottom:110px}

/* SNOW */
#snow-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:9000}
.snowflake{position:absolute;top:-30px;color:#fff;user-select:none;pointer-events:none;text-shadow:0 0 6px rgba(255,255,255,.8);animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translateY(-30px) translateX(0) rotate(0)}25%{transform:translateY(25vh) translateX(20px) rotate(90deg)}50%{transform:translateY(50vh) translateX(-20px) rotate(180deg)}75%{transform:translateY(75vh) translateX(20px) rotate(270deg)}100%{transform:translateY(110vh) translateX(-10px) rotate(360deg)}}
@keyframes titleAnimation{0%{opacity:0;transform:translateY(-35px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cardAnimation{0%{opacity:0;transform:translateY(60px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}

@media(max-width:1200px){.product-container{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.navbar{padding:8px 4%}.section-title h1{font-size:40px}.product-container{grid-template-columns:repeat(2,1fr)}.product-card{height:230px}}
@media(max-width:600px){.logo img{width:84px;height:82px}.products-section{padding:150px 4% 60px}.section-title{margin-bottom:35px}.section-title h1{font-size:32px}.section-title p{font-size:14px;line-height:1.6}.product-container{gap:12px}.product-card{height:200px;border-radius:13px}.product-image::before{font-size:10px;padding:8px 16px}.footer-links{margin-top:12px;margin-left:0}}
@media(max-width:430px){.product-container{grid-template-columns:1fr}.product-card{height:280px}.section-title h1{font-size:28px}.image-modal{padding:15px}.image-modal img{max-width:96%;max-height:82vh}.close-modal{right:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.product-card{opacity:1!important;transform:none!important}}

      : '<b>New designs coming soon</b>Our jersey collection is being updated. Contact us on WhatsApp for custom designs.';
    g.appendChild(em);
  }
  photos.forEach(function (p, i) {
    var card = el('div', 'product-card');
    card.style.animationDelay = (Math.min(i, 10) * 0.06) + 's';
    var wrap = el('div', 'product-image');
    var img = new Image();
    img.src = p.src;
    img.alt = 'KAIRA GARMENT jersey design ' + (i + 1);
    img.decoding = 'async';
    wrap.appendChild(img);
    card.appendChild(wrap);
    card.addEventListener('click', function () { openModal(p.src); });
    if (isAdmin) {
      var b = el('button', 'del-btn');
      b.type = 'button';
      b.textContent = 'Delete';
      var t;
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!b.classList.contains('sure')) {
          b.classList.add('sure');
          b.textContent = 'Sure? Tap again';
          clearTimeout(t);
          t = setTimeout(function () { b.classList.remove('sure'); b.textContent = 'Delete'; }, 3000);
          return;
        }
        photos = photos.filter(function (x) { return x.id !== p.id; });
        dirty = true;
        renderGallery();
      });
      card.appendChild(b);
    }
    g.appendChild(card);
  });
  updateBar();
}

function updateBar() {
  document.body.classList.toggle('has-admin', isAdmin);
  $('adminBar').classList.toggle('show', isAdmin);
  $('uploadBox').classList.toggle('show', isAdmin);
  $('adminText').style.display = isAdmin ? 'none' : '';
  if (!isAdmin) return;
  var info = '<b>Admin mode</b> &middot; ' + photos.length + ' photos &middot; ' + mb(totalBytes()) + ' MB used';
  info += dirty
    ? '<br><span class="warn">Unpublished changes &mdash; press Publish so customers can see them.</span>'
    : '<br>All changes are published.';
  $('adminInfo').innerHTML = info;
  $('pubBtn').disabled = !dirty;
}

/* ---------- image modal ---------- */
var modal = $('imageModal');
function openModal(src) {
  $('modalImage').src = src;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeImage() {
  modal.classList.remove('active');
  document.body.style.overflow = '';
}
$('closeModal').addEventListener('click', closeImage);
modal.addEventListener('click', function (e) { if (e.target === modal) closeImage(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeImage(); if ($('loginScreen').classList.contains('show')) hideLogin(); }
});

/* ---------- login ---------- */
var fails = 0, lockedUntil = 0;
function showLogin() {
  $('lgErr').textContent = '';
  $('lgPass').value = '';
  $('loginScreen').classList.add('show');
  setTimeout(function () { $('lgUser').focus(); }, 50);
}
function hideLogin() { $('loginScreen').classList.remove('show'); }

async function sha256(s) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
}

async function doLogin() {
  var now = Date.now();
  if (now < lockedUntil) {
    $('lgErr').textContent = 'Too many attempts. Wait ' + Math.ceil((lockedUntil - now) / 1000) + 's.';
    return;
  }
  var u = $('lgUser').value.trim().toLowerCase();
  var p = $('lgPass').value;
  if (!u || !p) { $('lgErr').textContent = 'Enter username and password.'; return; }
  var h;
  try { h = await sha256(SALT + ':' + u + ':' + p); }
  catch (e) { $('lgErr').textContent = 'Login is not supported in this browser.'; return; }
  if (u === AUTH_USER && h === AUTH_HASH) {
    fails = 0;
    isAdmin = true;
    try { sessionStorage.setItem('kg_admin', '1'); } catch (e) {}
    hideLogin();
    renderGallery();
    toast('Welcome, admin!');
  } else {
    fails++;
    $('lgErr').textContent = 'Wrong username or password.';
    $('lgPass').value = '';
    if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; $('lgErr').textContent = 'Too many attempts. Try again in 30s.'; }
  }
}

function doLogout() {
  isAdmin = false;
  try { sessionStorage.removeItem('kg_admin'); } catch (e) {}
  photos = savedPhotos.slice();
  dirty = false;
  renderGallery();
}

$('adminLink').addEventListener('click', function () { if (isAdmin) toast('You are already logged in as admin.'); else showLogin(); });
$('adminText').addEventListener('click', showLogin);
$('lgBtn').addEventListener('click', doLogin);
$('lgBack').addEventListener('click', hideLogin);
$('lgPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
$('lgUser').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('lgPass').focus(); });
$('eyeBtn').addEventListener('click', function () {
  var i = $('lgPass');
  var show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  $('eyeBtn').textContent = show ? 'HIDE' : 'SHOW';
});
$('outBtn').addEventListener('click', doLogout);

/* ---------- upload ---------- */
function compress(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var MAX = 1100;
      var w = img.naturalWidth, h = img.naturalHeight;
      var s = Math.min(1, MAX / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var x = c.getContext('2d');
      x.fillStyle = '#111';
      x.fillRect(0, 0, w, h);
      x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

$('addBtn').addEventListener('click', function () { $('fileInput').click(); });
$('uploadBox').addEventListener('click', function () { $('fileInput').click(); });
$('uploadBox').addEventListener('dragover', function (e) { e.preventDefault(); $('uploadBox').classList.add('drag'); });
$('uploadBox').addEventListener('dragleave', function () { $('uploadBox').classList.remove('drag'); });
$('uploadBox').addEventListener('drop', function (e) {
  e.preventDefault();
  $('uploadBox').classList.remove('drag');
  var fs = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []).filter(function (f) { return /^image\//.test(f.type); });
  if (fs.length) handleFiles(fs);
});
$('fileInput').addEventListener('change', function (e) {
  var fs = Array.prototype.slice.call(e.target.files || []);
  e.target.value = '';
  if (fs.length) handleFiles(fs);
});
async function handleFiles(files) {
  if (!files.length) return;
  $('addBtn').disabled = true;
  var added = [], skipped = 0, failed = 0;
  for (var i = 0; i < files.length; i++) {
    toast('Processing photo ' + (i + 1) + ' of ' + files.length + '...', false, 60000);
    try {
      var src = await compress(files[i]);
      if (totalBytes() + added.reduce(function (a, p) { return a + p.src.length; }, 0) + src.length > MAX_TOTAL_BYTES) { skipped++; continue; }
      added.push({ id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), src: src });
    } catch (err) { failed++; }
  }
  if (added.length) { photos = added.concat(photos); dirty = true; }
  $('addBtn').disabled = false;
  renderGallery();
  var msg = added.length + ' photo(s) added.';
  if (skipped) msg += ' ' + skipped + ' skipped (storage limit reached - delete some old photos).';
  if (failed) msg += ' ' + failed + ' could not be read (use JPG or PNG).';
  toast(msg, !!(skipped || failed), 6000);
}

/* ---------- publish ---------- */
function buildDoc() {
  var css = $('app-css').textContent;
  var js = $('app-js').textContent;
  var json = JSON.stringify({ logo: LOGO, photos: photos }).replace(/</g, '\\u003c');
  return '<!DOCTYPE html>\n<html lang="en"><head>' + HEAD +
    '<style id="app-css">' + css + '</style></head><body><div id="app"></div>' +
    '<script id="site-data" type="application/json">' + json + '<\/script>' +
    '<script id="app-js">' + js + '<\/script></body></html>';
}

$('pubBtn').addEventListener('click', async function () {
  if (!dirty) return;
  var art = null;
  try { art = window.claude && await window.claude.use('artifact'); } catch (e) {}
  if (!art) {
    toast('Publishing works only when you open this page from your Claude account link. Open the link while signed in to Claude.', true, 8000);
    return;
  }
  var doc = buildDoc();
  if (doc.length > 15.5 * 1024 * 1024) { toast('Too many photos. Delete a few and try again.', true, 6000); return; }
  $('pubBtn').disabled = true;
  toast('Publishing... please wait.', false, 60000);
  try {
    await art.publish(doc);
    toast('Published! Reloading...');
  } catch (err) {
    var code = err && err.code;
    if (code === 'conflict') return;
    $('pubBtn').disabled = false;
    if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') toast('Only the website owner (signed in to Claude) can publish.', true, 8000);
    else if (code === 'too_large') toast('Page is too large. Delete some photos.', true, 6000);
    else if (code === 'rate_limited') toast('Publishing too often. Wait a minute and try again.', true, 6000);
    else toast('Publish failed. Please try again.', true, 6000);
  }
});

/* ---------- snow ---------- */
(function () {
  var box = $('snow-container');
  var sym = ['\u2744', '\u2745', '\u2746', '\u2022'];
  for (var i = 0; i < 70; i++) {
    var s = el('span', 'snowflake');
    s.textContent = sym[Math.floor(Math.random() * sym.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (7 + Math.random() * 16) + 'px';
    s.style.opacity = 0.35 + Math.random() * 0.65;
    s.style.animationDuration = (6 + Math.random() * 10) + 's';
    s.style.animationDelay = Math.random() * 10 + 's';
    box.appendChild(s);
  }
})();

renderGallery();
if (!isAdmin && /admin/i.test(location.hash)) showLogin();
window.addEventListener('hashchange', function () { if (!isAdmin && /admin/i.test(location.hash)) showLogin(); });
})();
